name: OV Build MacroQuest Emu TOB Release

on:
  workflow_dispatch:
    inputs:
      headline:
        description: First line of the release notes (optional)
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  call_build:
    uses: ./.github/workflows/ov_build_release_shared.yaml
    with:
      client_target: emu-tob
      headline: ${{ inputs.headline }}
    secrets: inherit
